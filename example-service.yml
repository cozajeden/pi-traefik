version: "3.9"

# ============================================================
# EXAMPLE SERVICE STACK
# Deploy your apps using this template.
# Each service needs traefik labels to be routed correctly.
#
# Deploy: docker stack deploy -c example-service.yml myapp
# ============================================================

services:

  whoami:
    image: traefik/whoami
    networks:
      - traefik_public
    deploy:
      replicas: 2
      labels:
        - "traefik.enable=true"
        - "traefik.swarm.network=traefik_public"
        - "traefik.http.routers.whoami.rule=Host(`ryszard-napierala.dev`)"
        - "traefik.http.routers.whoami.entrypoints=websecure"
        - "traefik.http.routers.whoami.tls=true"
        - "traefik.http.services.whoami.loadbalancer.server.port=80"

networks:
  traefik_public:
    external: true
