version: "3.9"

# ============================================================
# BEFORE DEPLOYING:
# 1. Create secrets:
#    echo "YOUR_CF_TUNNEL_TOKEN" | docker secret create cloudflare_tunnel_token -
#    docker secret create cf_origin_cert /path/to/origin.pem
#    docker secret create cf_origin_key /path/to/origin-key.pem
#
#    # Generate dashboard credentials (requires apache2-utils):
#    htpasswd -nb admin YOUR_PASSWORD > /tmp/traefik_users
#    docker secret create traefik_users /tmp/traefik_users
#    rm /tmp/traefik_users
#
# 2. Deploy:
#    docker stack deploy -c traefik-stack.yml traefik
# ============================================================

services:

  # ----------------------------------------------------------
  # TRAEFIK
  # ----------------------------------------------------------
  traefik:
    image: traefik:v3.6.9
    command:
      # API & Dashboard
      - "--api.dashboard=true"
      - "--api.insecure=false"

      # Providers
      - "--providers.swarm=true"
      - "--providers.swarm.exposedbydefault=false"
      - "--providers.swarm.network=traefik_public"

      # Entrypoints
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"

      # Redirect HTTP → HTTPS globally
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.web.http.redirections.entrypoint.permanent=true"

      # ACME / Let's Encrypt via Cloudflare DNS-01
      # DNS-01 is mandatory here: the origin is behind a Cloudflare Tunnel with
      # proxied DNS, so HTTP-01 and TLS-ALPN-01 can never reach this node.
      - "--certificatesresolvers.letsencrypt.acme.email=cozajeden@gmail.com"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.dnschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.dnschallenge.provider=cloudflare"
      # Resolve the _acme-challenge TXT against public resolvers, not Docker's
      - "--certificatesresolvers.letsencrypt.acme.dnschallenge.resolvers=1.1.1.1:53,8.8.8.8:53"
      - "--certificatesresolvers.letsencrypt.acme.dnschallenge.propagation.delaybeforechecks=15"

      # Every websecure router gets the wildcard cert by default
      - "--entrypoints.websecure.http.tls=true"
      - "--entrypoints.websecure.http.tls.certresolver=letsencrypt"
      - "--entrypoints.websecure.http.tls.domains[0].main=ryszard-napierala.dev"
      - "--entrypoints.websecure.http.tls.domains[0].sans=*.ryszard-napierala.dev"

      # TLS default cert from Cloudflare Origin Certificate
      - "--providers.file.filename=/etc/traefik/tls.yml"
      - "--providers.file.watch=true"

      # Logs
      - "--log.level=INFO"
      - "--accesslog=true"

    ports:
      - target: 80
        published: 80
        protocol: tcp
      - target: 443
        published: 443
        protocol: tcp

    environment:
      # Cloudflare API token for the DNS-01 challenge (Zone:DNS:Edit + Zone:Zone:Read)
      CF_DNS_API_TOKEN_FILE: /run/secrets/cf_dns_api_token

    # IPv4-only ACME: acme-v02.api.letsencrypt.org publishes A + AAAA, and
    # where IPv6 is unreliable Traefik can dial the AAAA and fail with
    # "connect: network is unreachable". Disabling IPv6 in the container's
    # network namespace forces IPv4.
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1

    # Traefik v3.6.9 bundles lego v4.32, which cannot be told to prefer a
    # network stack (that arrived in lego v5 -- go-acme/lego#1801,
    # traefik#13302). Because the ACME endpoint publishes A + AAAA, lego can
    # still dial the AAAA and fail with "cannot assign requested address".
    # Disabling IPv6 in the container is NOT sufficient -- Go still dials it.
    # Go's resolver consults /etc/hosts before DNS, so pinning the endpoint to
    # its IPv4 address removes the AAAA from view entirely.
    # NOTE: if renewal ever fails, re-check this IP:
    #   dig +short A acme-v02.api.letsencrypt.org
    extra_hosts:
      - "acme-v02.api.letsencrypt.org:172.65.32.248"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_certs:/certs   # origin cert files copied from secrets on init (fallback)
      - traefik_acme:/letsencrypt   # acme.json - shared read-only with the mail stack

    configs:
      - source: traefik_tls_config
        target: /etc/traefik/tls.yml

    secrets:
      - cf_origin_cert
      - cf_origin_key
      - traefik_users
      - cf_dns_api_token

    networks:
      - traefik_public

    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == pi
      labels:
        - "traefik.enable=true"
        # BasicAuth middleware — credentials loaded from Docker secret (htpasswd format)
        - "traefik.http.middlewares.dashboard-auth.basicauth.usersfile=/run/secrets/traefik_users"
        # Dashboard router
        - "traefik.http.routers.traefik-dashboard.rule=Host(`${DASHBOARD_HOST:?set DASHBOARD_HOST in .env}`)"
        - "traefik.http.routers.traefik-dashboard.entrypoints=websecure"
        - "traefik.http.routers.traefik-dashboard.tls=true"
        - "traefik.http.routers.traefik-dashboard.tls.certresolver=letsencrypt"
        - "traefik.http.routers.traefik-dashboard.tls.domains[0].main=ryszard-napierala.dev"
        - "traefik.http.routers.traefik-dashboard.tls.domains[0].sans=*.ryszard-napierala.dev"
        - "traefik.http.routers.traefik-dashboard.service=api@internal"
        - "traefik.http.routers.traefik-dashboard.middlewares=dashboard-auth"
        - "traefik.http.services.traefik-dashboard.loadbalancer.server.port=8080"


      restart_policy:
        condition: any
        delay: 5s

  # ----------------------------------------------------------
  # CERT INIT — copies secrets to volume on startup
  # Runs once, then exits. Traefik reads certs from the volume.
  # ----------------------------------------------------------
  cert-init:
    image: alpine:3.20
    command: >
      sh -c "
        cp /run/secrets/cf_origin_cert /certs/origin.pem &&
        cp /run/secrets/cf_origin_key /certs/origin-key.pem &&
        chmod 600 /certs/origin.pem /certs/origin-key.pem &&
        echo 'Certs copied successfully'
      "
    volumes:
      - traefik_certs:/certs
    secrets:
      - cf_origin_cert
      - cf_origin_key
    deploy:
      replicas: 1
      restart_policy:
        condition: none   # run once only
      placement:
        constraints:
          - node.hostname == pi
  # ----------------------------------------------------------
  # CLOUDFLARED
  # ----------------------------------------------------------
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN_FILE: /run/secrets/cloudflare_tunnel_token
    secrets:
      - cloudflare_tunnel_token
    networks:
      - traefik_public
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == pi
      restart_policy:
        condition: any
        delay: 5s
    depends_on:
      - traefik

# ============================================================
# VOLUMES
# ============================================================
volumes:
  # acme.json lives on a host bind path so the mail stack can mount the same file.
  # Create it once before deploying:
  #   sudo mkdir -p /traefik/acme_volume && sudo touch /traefik/acme_volume/acme.json
  #   sudo chmod 600 /traefik/acme_volume/acme.json
  traefik_acme:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /traefik/acme_volume

  traefik_certs:
    driver: local
    # To use NFS or shared storage across nodes, replace with:
    # driver_opts:
    #   type: nfs
    #   o: addr=NFS_SERVER_IP,rw
    #   device: ":/path/to/certs"

# ============================================================
# NETWORKS
# ============================================================
networks:
  traefik_public:
    driver: overlay
    attachable: true
    name: traefik_public

# ============================================================
# SECRETS
# ============================================================
secrets:
  cloudflare_tunnel_token:
    external: true
  cf_origin_cert:
    external: true
  cf_origin_key:
    external: true
  cf_dns_api_token:
    external: true
  traefik_users:
    external: true
    name: traefik_users_1787826739

# ============================================================
# CONFIGS
# ============================================================
configs:
  traefik_tls_config:
    file: ./tls.yml
    # Docker configs are immutable: bump this suffix whenever tls.yml changes,
    # otherwise `docker stack deploy` silently keeps serving the old content.
    name: traefik_tls_config_v6
